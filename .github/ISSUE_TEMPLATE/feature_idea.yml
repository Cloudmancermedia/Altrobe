name: Feature idea
description: Suggest something Altrobe could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like Altrobe to do.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Sketches, screenshots or examples from other tools.
